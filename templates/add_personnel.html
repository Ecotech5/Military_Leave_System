{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Add New Personnel</h2>
    <div class="alert-info" style="margin-bottom: 20px;">
        <strong>Default Password:</strong> New users will have default password <strong>NACWC123456</strong><br>
        They will be required to change it on first login.
    </div>

    <form method="POST">
        <div class="grid-2">
            <div>
                <label>Service Number *</label>
                <input type="text" name="service_number" placeholder="e.g., NG/A/001" required>
            </div>
            <div>
                <label>Full Name *</label>
                <input type="text" name="name" placeholder="Full Name" required>
            </div>
            <div>
                <label>Rank *</label>
                <select name="rank" required>
                    <option value="">Select Rank</option>
                    <optgroup label="Soldiers">
                        <option value="Private">Private</option>
                        <option value="Lance Corporal">Lance Corporal</option>
                        <option value="Corporal">Corporal</option>
                        <option value="Sergeant">Sergeant</option>
                        <option value="Staff Sergeant">Staff Sergeant</option>
                        <option value="Warrant Officer">Warrant Officer</option>
                        <option value="Master Warrant Officer">Master Warrant Officer</option>
                        <option value="Army Warrant Officer">Army Warrant Officer</option>
                        <option value="RSM">RSM</option>
                    </optgroup>
                    <optgroup label="Officers">
                        <option value="Second Lieutenant">Second Lieutenant</option>
                        <option value="Lieutenant">Lieutenant</option>
                        <option value="Captain">Captain</option>
                        <option value="Major">Major</option>
                        <option value="Chief of Staff">Chief of Staff</option>
                        <option value="Lieutenant Colonel">Lieutenant Colonel</option>
                        <option value="Colonel">Colonel</option>
                        <option value="Brigadier General">Brigadier General</option>
                        <option value="Major General">Major General</option>
                        <option value="Admin Officer">Admin Officer</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <label>Rank Category *</label>
                <select name="rank_category" required>
                    <option value="">Select Category</option>
                    <option value="soldier">Soldier</option>
                    <option value="officer">Officer</option>
                </select>
            </div>
            <div>
                <label>Rank Order *</label>
                <input type="number" name="rank_order" placeholder="Enter rank order number" required>
                <small>Soldiers: 1-9, Officers: 1-12</small>
            </div>
            <div>
                <label>Unit</label>
                <input type="text" name="unit" placeholder="e.g., Alpha Company">
            </div>
            <div>
                <label>Platoon</label>
                <input type="text" name="platoon" placeholder="e.g., 1st Platoon">
            </div>
            <div>
                <label>Email</label>
                <input type="email" name="email" placeholder="email@domain.com">
            </div>
            <div>
                <label>Phone</label>
                <input type="tel" name="phone" placeholder="08012345678">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Add Personnel</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-warning">Cancel</a>
        </div>
    </form>
</div>

<script>
    // Auto-populate rank_order based on selected rank
    document.querySelector('select[name="rank"]').addEventListener('change', function () {
        const rank = this.value;
        const rankOrderInput = document.querySelector('input[name="rank_order"]');

        const rankOrders = {
            // Soldiers
            'Private': 1,
            'Lance Corporal': 2,
            'Corporal': 3,
            'Sergeant': 4,
            'Staff Sergeant': 5,
            'Warrant Officer': 6,
            'Master Warrant Officer': 7,
            'Army Warrant Officer': 8,
            'RSM': 9,
            // Officers
            'Second Lieutenant': 1,
            'Lieutenant': 2,
            'Captain': 3,
            'Major': 4,
            'Chief of Staff': 5,
            'Lieutenant Colonel': 6,
            'Colonel': 7,
            'Brigadier General': 8,
            'Major General': 9,
            'Admin Officer': 12
        };

        if (rankOrders[rank]) {
            rankOrderInput.value = rankOrders[rank];
        } else {
            rankOrderInput.value = '';
        }
    });

    // Auto-set rank category based on selected rank
    document.querySelector('select[name="rank"]').addEventListener('change', function () {
        const rank = this.value;
        const categorySelect = document.querySelector('select[name="rank_category"]');

        const soldierRanks = ['Private', 'Lance Corporal', 'Corporal', 'Sergeant', 'Staff Sergeant',
            'Warrant Officer', 'Master Warrant Officer', 'Army Warrant Officer', 'RSM'];
        const officerRanks = ['Second Lieutenant', 'Lieutenant', 'Captain', 'Major', 'Chief of Staff',
            'Lieutenant Colonel', 'Colonel', 'Brigadier General', 'Major General', 'Admin Officer'];

        if (soldierRanks.includes(rank)) {
            categorySelect.value = 'soldier';
        } else if (officerRanks.includes(rank)) {
            categorySelect.value = 'officer';
        } else {
            categorySelect.value = '';
        }
    });
</script>
{% endblock %}
